<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gadai Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 650px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 8px; border-bottom: 1px solid #ddd; }
        .label { font-weight: bold; width: 35%; }
        input[type="number"], input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .readonly-bg { background-color: #eeeeee; cursor: not-allowed; }
        .required { color: red; }
        
        /* Style Tombol Salin */
        .copy-btn {
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .copy-btn:hover { background-color: #0056b3; }
        .copy-btn:active { background-color: #004085; }
        .input-wrapper { display: flex; gap: 5px; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Perhitungan</h2>
    <table>
        <!-- Jenis Barang -->
        <tr>
            <td class="label">Jenis Barang <span class="required">*</span></td>
            <td>
                <select id="jenisBarang" onchange="hitungSemua()">
                    <option value="lainnya">Lainnya</option>
                    <option value="motor">Motor</option>
                    <option value="mobil">Mobil</option>
                </select>
            </td>
        </tr>

        <!-- Pencairan -->
        <tr>
            <td class="label">Pencairan (Rp) <span class="required">*</span></td>
            <td><input type="number" id="pencairan" placeholder="Masukkan angka" oninput="hitungSemua()"></td>
        </tr>

        <!-- Bunga -->
        <tr>
            <td class="label">Bunga <span class="required">*</span></td>
            <td>
                <div class="radio-group">
                    <label><input type="radio" name="bungaOpt" value="0.10" onclick="toggleBungaLain(false)" checked > 10%</label>
                    <label><input type="radio" name="bungaOpt" value="0.05" onclick="toggleBungaLain(false)" > 5%</label>
                    <label><input type="radio" name="bungaOpt" value="lainnya" id="radioBungaLain" onclick="toggleBungaLain(true)"> Lainnya:</label>
                    <input type="number" id="bungaPersenLain" style="width: 60px;" placeholder="%" oninput="hitungSemua()" disabled>
                </div>
                <div class="input-wrapper" style="margin-top:5px;">
                    <input type="text" id="hasilBunga" class="readonly-bg" readonly placeholder="Hasil Bunga">
                    <button class="copy-btn" onclick="copyToClipboard('hasilBunga')">Copy</button>
                </div>
            </td>
        </tr>

        <!-- Admin -->
        <tr>
            <td class="label">Admin</td>
            <td>
                <div class="input-wrapper">
                    <input type="text" id="admin" class="readonly-bg" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('admin')">Copy</button>
                </div>
            </td>
        </tr>

        <!-- Biaya Penyimpanan -->
        <tr>
            <td class="label">Biaya Penyimpanan</td>
            <td>
                <div class="input-wrapper">
                    <input type="text" id="biayaSimpan" class="readonly-bg" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('biayaSimpan')">Copy</button>
                </div>
            </td>
        </tr>

        <!-- Tanggal Jatuh Tempo -->
        <tr>
            <td class="label">Jatuh Tempo</td>
            <td>
                <div class="radio-group" style="margin-bottom: 8px;">
                    <label><input type="radio" name="tenor" value="1m" onclick="hitungSemua()" checked> 1 Bulan</label>
                    <label><input type="radio" name="tenor" value="14d" onclick="hitungSemua()"> 14 Hari</label>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="tglJatuhTempo" class="readonly-bg" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('tglJatuhTempo')">Copy</button>
                </div>
            </td>
        </tr>

        <!-- Tanggal Lelang -->
        <tr>
            <td class="label">Tanggal Lelang</td>
            <td>
                <div class="input-wrapper">
                    <input type="text" id="tglLelang" class="readonly-bg" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('tglLelang')">Copy</button>
                </div>
            </td>
        </tr>
    </table>
</div>

<script>
    const hariIni = new Date();

    function formatTanggal(date) {
        let d = date.getDate().toString().padStart(2, '0');
        let m = (date.getMonth() + 1).toString().padStart(2, '0');
        let y = date.getFullYear();
        return `${d}/${m}/${y}`;
    }

    function toggleBungaLain(show) {
        document.getElementById('bungaPersenLain').disabled = !show;
        hitungSemua();
    }

    // FUNGSI COPY BARU
    function copyToClipboard(id) {
        const input = document.getElementById(id);
        const text = input.value;
        
        if (text === "" || text === "0") {
            alert("Tidak ada nilai untuk disalin");
            return;
        }

        navigator.clipboard.writeText(text).then(() => {
            alert("Tersalin: " + text);
        }).catch(err => {
            console.error('Gagal menyalin: ', err);
        });
    }

    function hitungSemua() {
        let pencairan = parseFloat(document.getElementById('pencairan').value) || 0;
        let jenis = document.getElementById('jenisBarang').value;
        let tenor = document.querySelector('input[name="tenor"]:checked').value;
        
        let bungaPersen = 0;
        let radioBunga = document.querySelector('input[name="bungaOpt"]:checked').value;
        
        if (radioBunga === "lainnya") {
            bungaPersen = (parseFloat(document.getElementById('bungaPersenLain').value) || 0) / 100;
        } else {
            bungaPersen = parseFloat(radioBunga);
        }

        let totalBunga = pencairan * bungaPersen;
        document.getElementById('hasilBunga').value = totalBunga.toLocaleString('id-ID');

        let biayaAdmin = 0;
        if (radioBunga === "0.05") {
            biayaAdmin = pencairan * 0.01;
        } else if (radioBunga === "0.10") {
            biayaAdmin = pencairan * 0.02;
        }
        document.getElementById('admin').value = biayaAdmin.toLocaleString('id-ID');

        let biayaSimpan = 0;
        if (jenis === "motor") {
            biayaSimpan = 100000;
        } else if (jenis === "mobil") {
            biayaSimpan = (tenor === "14d") ? 100000 : 200000;
        }
        document.getElementById('biayaSimpan').value = biayaSimpan.toLocaleString('id-ID');

        let tglJT = new Date(hariIni);
        let tglLelang = new Date(hariIni);

        if (tenor === "1m") {
            tglJT.setMonth(tglJT.getMonth() + 1);
            tglLelang = new Date(tglJT);
            tglLelang.setDate(tglLelang.getDate() + 7);
        } else {
            tglJT.setDate(tglJT.getDate() + 14);
            tglLelang = new Date(tglJT);
            tglLelang.setDate(tglLelang.getDate() + 3);
        }

        document.getElementById('tglJatuhTempo').value = formatTanggal(tglJT);
        document.getElementById('tglLelang').value = formatTanggal(tglLelang);
    }

    hitungSemua();
</script>

</body>
</html>
