<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gadai</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background-color: #fdddea; 
            display: flex;
            justify-content: center; /* Tengah horizontal */
            align-items: center;     /* Tengah vertikal */
            min-height: 100vh;       /* Tinggi minimal selayar penuh */
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            background: rgb(243, 200, 245); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            margin: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #d147a3;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        td { 
            padding: 12px 5px; 
            border-bottom: 1px solid #eec5e6; 
        }
        .label { 
            font-weight: bold; 
            width: 40%; 
            color: #555;
        }
        input[type="number"], 
        input[type="text"],
        select { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .radio-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center; 
            margin-bottom: 5px;
        }
        .readonly-bg { 
            background-color: #f1dffd; 
            border: 1px solid #d4b4e9 !important;
        }
        .required { color: red; }
        .copy-btn {
            padding: 8px 15px;
            background-color: #f47eff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            margin-top: 5px;
        }
        .copy-btn:hover { background-color: #c10ac7; }
        .input-with-button {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #Pelunasan {
        font-weight: 800; 
        font-size: 18px;
        color: #b71c1c; 
        border: 1px solid #a5d6a7;
    }

    #Perpanjangan {
        font-weight: 800; 
        font-size: 18px;
        color: #0d47a1; 
        border: 1px solid #81d4fa;
    }

    .row-highlight-pelunasan { background-color: #c8e6c9 !important; }
    .row-highlight-perpanjangan { background-color: #b3e5fc !important; }
    </style>
</head>
<body >

<div class="container">
    <h2 style="text-align: center;"  > 🌷˚ʚ💗 KAKULATOR GADAI 💗ɞ˚ 🌷 </h2>
    <table >
        <!-- Jenis Barang -->
        <tr>
            <td class="label">Jenis Barang <span class="required">*</span></td>
            <td>
                <select id="jenisBarang" onchange="hitungSemua()">
                    <option value="lainnya">Lainnya</option>
                    <option value="motor">Motor</option>
                    <option value="mobil">Mobil</option>
                    
                </select>
            </td>
        </tr>

        <!-- Pencairan -->
       <tr>
            <td class="label">Pencairan (Rp) <span class="required">*</span></td>
            <td><input type="text" id="pencairan" placeholder="0" oninput="formatAndCalculate(this)"></td>
        </tr>

        <!-- Bunga -->
        <tr>
            <td class="label">Bunga <span class="required">*</span></td>
            <td>
                <div class="radio-group">
                    <label><input type="radio" name="bungaOpt" value="0.10" onclick="toggleBungaLain(false)" checked > 10%</label>
                    <label><input type="radio" name="bungaOpt" value="0.05" onclick="toggleBungaLain(false)" > 5%</label>
                    <label><input type="radio" name="bungaOpt" value="lainnya" id="radioBungaLain" onclick="toggleBungaLain(true)"> Lainnya:</label>
                    <input type="number" id="bungaPersenLain" style="width: 60px;" placeholder="%" oninput="hitungSemua()" disabled>
                </div>
                <div style="margin-top:5px;">
                    Hasil: <input type="text" id="hasilBunga" class="readonly-bg" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('hasilBunga')">Copy</button>
                </div>
            </td>
        </tr>

        <!-- Admin -->
        <tr>
            <td class="label">Admin</td>
            <td><input type="text" id="admin" class="readonly-bg" readonly>
                <button class="copy-btn" onclick="copyToClipboard('admin')">Copy</button>
            </td>
            
        </tr>

        <!-- Biaya Penyimpanan -->
        <tr>
            <td class="label">Biaya Penyimpanan</td>
            <td><input type="text" id="biayaSimpan" class="readonly-bg" readonly>
                <button class="copy-btn" onclick="copyToClipboard('biayaSimpan')">Copy</button>
            </td>
           
        </tr>
        
        <!-- Jenis Customer -->
        <tr>
            <td class="label">Jenis Customer <span class="required">*</span></td>
            <td>
                <div class="radio-group">
                    <label><input type="radio" name="cust" value="RO" onclick="hitungSemua()" checked> Repeat Order (RO)</label>
                    <label><input type="radio" name="cust" value="NC" onclick="hitungSemua()"> New Customer (NC)</label>
                </div>
            </td>
        </tr>

        <!-- Hasil Perhitungan Utama -->
        <tr class="row-highlight-pelunasan" style="background-color: #bcf7c4;">
            <td class="label">Pelunasan</td>
            <td><input type="text" id="Pelunasan" class="readonly-bg"  readonly></td>
        </tr>
        
        <tr class="row-highlight-perpanjangan" style="background-color: #a9ecf8;">
            <td class="label">Perpanjangan</td>
            <td><input type="text" id="Perpanjangan" class="readonly-bg"  readonly></td>
        </tr>

        <!-- Tanggal Hari Ini -->
        <tr>
            <td class="label">Tanggal Hari Ini <span class="required">*</span></td>
            <td><input type="text" id="tglHariIni" class="readonly-bg" readonly></td>
        </tr>

        <!-- Pilihan Jatuh Tempo -->
        <tr>
            <td class="label">Pilihan Jatuh Tempo <span class="required">*</span></td>
            <td>
                <div class="radio-group">
                    <label><input type="radio" name="tenor" value="1m" onclick="hitungSemua()" checked> 1 Bulan</label>
                    <label><input type="radio" name="tenor" value="14d" onclick="hitungSemua()"> 2 Minggu/14 Hari</label>
                </div>
            </td>
        </tr>

        <!-- Tanggal Jatuh Tempo -->
        <tr>
            <td class="label">Tanggal Jatuh Tempo</td>
            <td><input type="text" id="tglJatuhTempo" class="readonly-bg" readonly>
                <button class="copy-btn" onclick="copyToClipboard('tglJatuhTempo')">Copy</button>
            </td>
            
        </tr>

        <!-- Tanggal Lelang -->
        <tr>
            <td class="label">Tanggal Lelang</td>
            <td><input type="text" id="tglLelang" class="readonly-bg" readonly>
                <button class="copy-btn" onclick="copyToClipboard('tglLelang')">Copy</button>
            </td>
        </tr>
    </table>
</div>

<script>
    function formatAndCalculate(input) {
        let value = input.value.replace(/\D/g, "");
        input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        hitungSemua();
    }

    function parseAngka(str) {
        if (!str) return 0;
        return parseFloat(str.replace(/\./g, "")) || 0;
    }
    
    const hariIni = new Date();
    document.getElementById('tglHariIni').value = formatTanggal(hariIni);

    function formatTanggal(date) {
        let d = date.getDate().toString().padStart(2, '0');
        let m = (date.getMonth() + 1).toString().padStart(2, '0');
        let y = date.getFullYear();
        return `${d}/${m}/${y}`;
    }

    function toggleBungaLain(show) {
        document.getElementById('bungaPersenLain').disabled = !show;
        hitungSemua();
    }

    function copyToClipboard(id) {
        const input = document.getElementById(id);
        const text = input.value;
        
        if (text === "" || text === "0") {
            alert("Tidak ada nilai untuk disalin");
            return;
        }

        navigator.clipboard.writeText(text).then(() => {
            alert("Tersalin: " + text);
        }).catch(err => {
            console.error('Gagal menyalin: ', err);
        });
    }

     function hitungSemua() {
        
        let pencairan = parseAngka(document.getElementById('pencairan').value);
        let jenis = document.getElementById('jenisBarang').value;
        let tenor = document.querySelector('input[name="tenor"]:checked').value;
        let jenisCust = document.querySelector('input[name="cust"]:checked').value;
        
        
        let bungaPersen = 0;
        let radioBungaValue = document.querySelector('input[name="bungaOpt"]:checked').value;
        
        if (radioBungaValue === "lainnya") {
            bungaPersen = (parseAngka(document.getElementById('bungaPersenLain').value)) / 100;
        } else {
            bungaPersen = parseFloat(radioBungaValue);
        }
        let totalBunga = pencairan * bungaPersen;
        document.getElementById('hasilBunga').value = totalBunga.toLocaleString('id-ID');

        
        let biayaAdmin = 0;
        if (radioBungaValue === "0.05") {
            biayaAdmin = pencairan * 0.01;
        } else if (radioBungaValue === "0.10") {
            biayaAdmin = pencairan * 0.02;
        }
        document.getElementById('admin').value = biayaAdmin.toLocaleString('id-ID');

        
        let biayaSimpan = 0;
        if (jenis === "motor") {
            biayaSimpan = 100000;
        } else if (jenis === "mobil") {
            biayaSimpan = (tenor === "14d") ? 100000 : 200000;
        } else {
            biayaSimpan = 0;
        }
        document.getElementById('biayaSimpan').value = biayaSimpan.toLocaleString('id-ID');

        
        let valPelunasan = 0;
        let valPerpanjangan = 0;

        if (jenisCust === "RO") {
            valPelunasan = pencairan + biayaAdmin + totalBunga + biayaSimpan;
            valPerpanjangan = biayaAdmin + totalBunga + biayaSimpan;
        } else {
            valPelunasan = pencairan + totalBunga + biayaSimpan;
            valPerpanjangan = totalBunga + biayaSimpan;
        }

        document.getElementById('Pelunasan').value = valPelunasan.toLocaleString('id-ID');
        document.getElementById('Perpanjangan').value = valPerpanjangan.toLocaleString('id-ID');
        let tglJT = new Date(hariIni);
        let tglLelang = new Date(hariIni);

        if (tenor === "1m") {
             tglJT.setDate(tglJT.getDate() + 30)
            tglLelang = new Date(tglJT);
            tglLelang.setDate(tglLelang.getDate() + 7);
        } else {
            tglJT.setDate(tglJT.getDate() + 14);
            tglLelang = new Date(tglJT);
            tglLelang.setDate(tglLelang.getDate() + 3);
        }

        document.getElementById('tglJatuhTempo').value = formatTanggal(tglJT);
        document.getElementById('tglLelang').value = formatTanggal(tglLelang);
    }


    hitungSemua();
</script>

</body>
</html>
